# Cu/CSHO GA search on Cu(111)
# Uses MACE-MP-0 small model for fast evaluation

method: ga

slab_file: cu111_slab.xyz

evaluator:
  backend: mace
  model: small
  device: cpu
  dtype: float64

blocks:
  - name: H2O
    chemical_potential: -14.22
  - name: CO2
    chemical_potential: -22.96
  - name: CO
    chemical_potential: -14.78
  - name: SO2
    chemical_potential: -12.50
  - name: HCOOH
    chemical_potential: -29.50
  - name: H
    chemical_potential: -3.39
  - name: O
    chemical_potential: -4.93
  - name: OH
    chemical_potential: -7.77
  - name: S
    chemical_potential: -4.00

composition:
  min_count: 2
  max_count: 6
  element_pool:
    C: [0, 4]
    H: [0, 12]
    O: [0, 8]
    S: [0, 2]

ga:
  population_size: 20
  n_to_optimize: 5
  n_steps: 100

region:
  z_offset_min: 1.5
  z_offset_max: 6.0

seed: 42
work_dir: ga_cu111_csho
