# CuS Reconstruction: Cu(111) surface under flue gas conditions
# m-GCMC search for stable surface configurations
#
# Adsorbates: *COOH, *HCOO, *CO, *S, *H, *O, *OH
# Gas reservoirs: H2O, CO2, SO2, H2 at 300 K
# Method: Modified GCMC (adsorb/desorb/swap = 0.4/0.4/0.2)

method: gcmc

slab_file: structure.vasp

# --- Slab region tagging ---
# Define 3 regions by z-height (Angstroms):
#   tag=0 (substrate): z < z_threshold[0]  — frozen
#   tag=1 (buffer):    z_threshold[0] <= z < z_threshold[1] — relaxed, not mutable
#   tag=2 (surface):   z >= z_threshold[1] — relaxed + mutable
# If omitted, regions are inferred from FixAtoms constraints in the structure file.
# z_threshold: [4.0, 8.0]

# --- Evaluator ---
# Phase 1: EMT (development / workflow validation)
# evaluator:
#   backend: emt

# Phase 2: MACE-MP (production, uncomment to use)
evaluator:
  backend: mace
  model: medium
  device: cpu
  # dtype: float64

# --- Adsorbate building blocks ---
# Chemical potentials (eV) for EMT development mode.
# These are approximate values tuned for the EMT energy scale.
# For MACE/DFT production, use proper thermodynamic values.
#
# n_electrons: number of electrons transferred per species in CHE model.
#   mu_eff = mu + n_electrons * U,  where U is the electrochemical potential.
#   This is stored on each MolecularBlock and used automatically during
#   potential scans.
#
# bonds: Explicit intramolecular bond pairs (0-indexed within the molecule).
#   When provided, Hookean constraints are built from these bonds directly
#   instead of auto-detection from covalent radii. This is preferred for
#   intermediates like *COOH where auto-detection may pick up spurious bonds.
#   The bonds are stored on the MolecularBlock factory and do not need to be
#   specified in the config — they are defined in composition.py.
blocks:
  - name: H
    chemical_potential: 1.0
  - name: O
    chemical_potential: 2.0
  - name: OH
    chemical_potential: 3.0
  - name: S
    chemical_potential: 2.5
  - name: CO
    chemical_potential: 5.0
  - name: H2O
    chemical_potential: 4.0
  - name: COOH
    chemical_potential: 8.0
  - name: HCOO
    chemical_potential: 5.0

# --- GCMC parameters ---
# Note: Higher temperature for EMT (helps acceptance).
# Use 300 K for MACE/DFT production runs.
temperature: 300.0

move_weights:
  insert: 0.4
  delete: 0.4
  displace: 0.0
  swap: 0.2

max_displacement: 0.8

# --- Composition constraints ---
composition:
  total_max: 16  # max adsorbate units on 4x4 surface

# --- Search settings ---
n_steps: 100
seed: 42
work_dir: search

# --- Bond constraints ---
# Hookean spring constraints prevent adsorbate molecules from dissociating
# during relaxation (e.g., C-O bond in CO, O-H bond in H2O).
# Two modes:
#   1. Explicit bonds (preferred): Each MolecularBlock carries its own bond
#      list AND per-block spring_constant / threshold_scale. Hookean springs
#      are applied to exactly those pairs — no heuristic detection needed.
#   2. Auto-detect (fallback): For blocks without explicit bonds, bonds are
#      inferred from covalent-radii distance with global defaults.
# No global config keys are needed — parameters live on MolecularBlock.

# --- Database recording (v1.1) ---
# Record all accepted configurations to an ASE SQLite database
db_file: gcmc_search.db

# --- Potential scan ---
# Formation energy reference potentials (V vs RHE)
# For EMT demo, only scan a few. Use full range for MACE/DFT.
potentials: [0.0, -1.0, -2.0]
