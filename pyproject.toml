[project]
name = "gs-gmlip"
version = "1.1.0"
description = "Global Searching by Global Machine Learning Interatomic Potential"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chao Yang" }]
dependencies = [
    "ase>=3.23.0",
    "jax>=0.4.30",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.18.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
mlip = ["mace-torch>=0.3.14"]
plumed = ["plumed>=2.10.0"]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "sphinx>=7.0.0",
]
all = ["gs-gmlip[mlip,plumed,dev]"]

[project.scripts]
gs_gmlip = "gs_gmlip.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gs_gmlip*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
